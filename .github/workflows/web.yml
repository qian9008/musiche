name: Deploy static content to Pages

on:
  push:
    branches: ['master']
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build-web:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 26

      - name: Build web artifacts
        run: |
          node web/scripts/version.js
          rm -f web/public/logo.png web/public/logo-circle.png || true
          cp resources/logo.png web/public/logo.png || true
          cp resources/logo-circle.png web/public/logo-circle.png || true
          cd web
          yarn
          yarn build:zip
          mkdir -p ../artifacts/web-app
          cp -R dist/. ../artifacts/web-app/
          yarn build:musiche
          echo '<html><head><script>if(!localStorage.getItem("musiche-proxy-address"))localStorage.setItem("musiche-proxy-address","https://music.picapico.top/proxy");let pathname=location.pathname.substring(9);let redirect=pathname?`${(location.search?"&":"?")}redirect=${pathname}`:"";location.href="/musiche"+location.search+redirect;</script></head></html>' > dist/404.html

      - name: Upload web app dist
        uses: actions/upload-artifact@v7
        with:
          name: web-app-dist
          path: artifacts/web-app

      - name: Upload web zip
        uses: actions/upload-artifact@v7
        with:
          name: web-zip
          path: web/web.zip

      - name: Upload Pages dist
        uses: actions/upload-artifact@v7
        with:
          name: pages-dist
          path: web/dist

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages-web-${{ github.run_attempt }}
          path: 'web/dist'

      - name: Deploy to GitHub Pages First
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-web-${{ github.run_attempt }}

  build-on-android:
    runs-on: ubuntu-latest
    needs: build-web
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.0

      - name: Download web app dist
        uses: actions/download-artifact@v8
        with:
          name: web-app-dist
          path: web/dist

      - name: Prepare assets
        shell: bash
        run: |
          rm -rf mobile/assets || true
          cp -r web/dist/* mobile/assets/ || true

      - name: Build Android package
        run: |
          sed -i 's#https\\://mirrors.cloud.tencent.com/gradle/#https\\://services.gradle.org/distributions/#g' android/gradle/wrapper/gradle-wrapper.properties
          flutter build apk --release
        working-directory: mobile

      - name: Stage Android package
        shell: bash
        run: |
          mkdir -p artifacts/android || true
          cp mobile/build/app/outputs/flutter-apk/app-release.apk artifacts/android/Musiche.apk || true

      - name: Upload Android package
        uses: actions/upload-artifact@v7
        with:
          name: android-package
          path: artifacts/android

  # 本 fork 已关闭 macOS / iOS / Windows 构建任务（runner 消耗高、失败率高）。
  # 上游 web.yml 含 build-on-macos / build-on-ios / build-on-windows 三个任务及对应产物，
  # 需要恢复时参考 https://github.com/HeHang0/musiche/blob/master/.github/workflows/web.yml
  publish:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs:
      - build-web
      - build-on-android
    steps:
      - name: Download Pages dist
        uses: actions/download-artifact@v8
        with:
          name: pages-dist
          path: web/dist

      - name: Download web zip
        uses: actions/download-artifact@v8
        with:
          name: web-zip
          path: packages/web

      - name: Download Android package
        uses: actions/download-artifact@v8
        with:
          name: android-package
          path: packages/android

      - name: Merge release files
        shell: bash
        run: |
          cp packages/web/web.zip web/dist/web.zip || true
          cp packages/android/Musiche.apk web/dist/Musiche.apk || true
          ls -la web/dist

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages-complete-${{ github.run_attempt }}
          path: 'web/dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-complete-${{ github.run_attempt }}

      - name: Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            web/dist/web.zip
            web/dist/Musiche.apk
